# Continuous integration: every change goes through Code, Build and Test before it can be merged.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # A release runs the same checks on the tagged commit.
  workflow_call:
  # Pull requests opened by the pipeline itself do not start workflows: the pipeline starts this one for them.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SLITHER_VERSION: 0.11.6
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  # ── Code ──────────────────────────────────────────────────────────────────────────────────────────────────

  lint:
    name: Code · lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Solidity style and lint
        run: npm run lint:contracts
      - name: Web lint
        run: npm run lint -w web
      - name: Web types
        run: npm run typecheck -w web
      - name: Formatting of everything else
        run: npm run format:check

  secrets:
    name: Code · secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: a secret removed in a later commit is still a leaked secret.
          fetch-depth: 0
          persist-credentials: false
      # The scanner is fetched at a fixed version and checked against the checksum of its release.
      - name: Install gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the history
        run: '"$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --redact --no-banner --verbose'

  # ── Build ─────────────────────────────────────────────────────────────────────────────────────────────────

  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Compile
        working-directory: contracts
        run: forge build --sizes
      - name: The committed ABI matches the contract
        run: npm run abi:check
      - name: The committed storage layout matches the contract
        run: npm run storage:check
      - name: Reference documentation
        run: npm run docs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contracts
          path: |
            contracts/out/AssertDAO.sol/AssertDAO.json
            contracts/docs
          if-no-files-found: error

  # ── Test ──────────────────────────────────────────────────────────────────────────────────────────────────

  test:
    name: Test · unit, fuzz, invariants
    runs-on: ubuntu-24.04
    env:
      # Longer fuzzing and invariant campaigns than on a developer's machine.
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Run the contract test suite
        working-directory: contracts
        run: forge test -vvv --no-match-contract GasTest

  coverage:
    name: Test · coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Measure, and hold the line
        run: npm run coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: contracts/lcov.info
          if-no-files-found: error

  gas:
    name: Test · gas
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: The committed gas snapshot matches the contract
        run: npm run gas:check
      - name: Report
        run: |
          {
            echo '### Gas per operation'
            echo
            echo '| operation | gas |'
            echo '| --- | ---: |'
            jq -r 'to_entries[] | "| \(.key) | \(.value) |"' contracts/snapshots/GasTest.json
          } >> "$GITHUB_STEP_SUMMARY"

  static-analysis:
    name: Test · static analysis
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Slither
        working-directory: contracts
        run: uvx --from "slither-analyzer==$SLITHER_VERSION" slither . --sarif slither.sarif
      # Code scanning is free for public repositories only.
      - if: always() && !github.event.repository.private
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: contracts/slither.sarif
          category: slither

  upgrade-safety:
    name: Test · upgrade safety
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The storage of the contract must stay compatible with what is deployed: the build of the latest release.
      - name: Fetch the build of the latest release
        id: released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download --pattern build-info.tar.gz --dir "$RUNNER_TEMP/released" 2>/dev/null; then
            tar -xzf "$RUNNER_TEMP/released/build-info.tar.gz" -C "$RUNNER_TEMP/released"
            echo "path=$RUNNER_TEMP/released/build-info" >> "$GITHUB_OUTPUT"
          else
            echo "No release yet: the contract is validated on its own."
          fi
      - name: Validate
        run: npm run upgrade:check -- ${{ steps.released.outputs.path }}

  web:
    name: Test · web app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Unit tests
        run: npm test -w web
      # The client library against the compiled contract on a local chain.
      - name: Integration tests
        run: npm run build:contracts && npm run test:integration -w web
      - name: Build
        run: npm run build -w web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web
          path: web/dist
          if-no-files-found: error

  # One check to require in the branch protection of main.
  ci:
    name: CI
    if: always()
    needs: [lint, secrets, build, test, coverage, gas, static-analysis, upgrade-safety, web]
    runs-on: ubuntu-24.04
    steps:
      - name: Every job passed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "$results"
          for result in $results; do
            [ "$result" = success ] || exit 1
          done
