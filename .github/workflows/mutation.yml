# Tests the tests: plants small faults in the contract and counts how many the suite catches. Slow, so it runs
# weekly and on demand rather than on every change, and it informs rather than blocks.
name: Mutation testing

on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutate:
    name: Mutation testing
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Run the campaign
        run: npm run mutate 2>&1 | tee "$RUNNER_TEMP/mutation.log"
      - name: Report
        if: always()
        run: |
          {
            echo '### Mutation testing'
            echo '```'
            grep -E 'INFO:Slither-Mutate' "$RUNNER_TEMP/mutation.log" | tail -n 40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-campaign
          path: contracts/mutation_campaign
          if-no-files-found: ignore
