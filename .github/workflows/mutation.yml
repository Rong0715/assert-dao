# Tests the tests: plants small faults in the contract and counts how many the suite catches. Slow, so it runs
# weekly and on demand rather than on every change, and it informs rather than blocks.
name: Mutation testing

on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutate:
    name: Mutation testing
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Run the campaign
        run: npm run mutate 2>&1 | tee "$RUNNER_TEMP/mutation.log"
      - name: Report
        if: always()
        run: |
          {
            echo '### Mutation testing'
            echo '```'
            grep -E 'INFO:Slither-Mutate' "$RUNNER_TEMP/mutation.log" | tail -n 40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-campaign
          path: contracts/mutation_campaign
          if-no-files-found: ignore
