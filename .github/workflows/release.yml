# Release: a version tag on main is checked again, packaged, attested and published.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      security-events: write

  package:
    name: Release · package
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: The tag names a commit of main and the version the contract reports
        run: |
          version="${GITHUB_REF_NAME#v}"
          declared=$(grep -oE 'return "[0-9]+\.[0-9]+\.[0-9]+";' contracts/src/AssertDAO.sol | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ "$declared" != "${version%%-*}" ]; then
            echo "::error::The tag says ${version%%-*}, the contract reports $declared."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Releases are cut from main."
            exit 1
          fi

      - name: Package
        run: npm run package

      # Signed statement that these files were built by this workflow from this commit.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag such as v1.1.0-rc.1 is a release candidate.
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes "${flags[@]}"

  # Every release goes to staging on its own. Production is a decision: run the Deploy workflow by hand.
  staging:
    name: Staging
    needs: package
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      tag: ${{ github.ref_name }}
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      actions: write
