version: 2
updates:
  # Node packages of the root and of the web app, from the single lockfile.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Solidity libraries, pinned as submodules.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly

  # Actions, pinned by commit.
  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/setup']
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
